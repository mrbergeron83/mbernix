monitor=,preferred,auto,1
$mod=SUPER

# Float all windows by default (Windows/macOS style)
windowrulev2=float,class:.*

# Terminal + launcher
bind=$mod,RETURN,exec,alacritty
bind=$mod,SPACE,exec,walker
bind=$mod,0,exec,microsoft-edge

# Close / Exit
bind=$mod,Q,killactive
bind=$mod SHIFT,M,exit

# Toggle floating and drag/resize windows
bind=$mod,V,togglefloating
bindm=$mod,mouse:272,movewindow
bindm=$mod,mouse:273,resizewindow

# Window snapping (Windows/macOS style)
bind=$mod,UP,fullscreen,1
bind=$mod,DOWN,togglefloating
bind=$mod,LEFT,movefocus,l
bind=$mod,RIGHT,movefocus,r
bind=$mod SHIFT,LEFT,movewindow,l
bind=$mod SHIFT,RIGHT,movewindow,r
bind=$mod SHIFT,UP,movewindow,u
bind=$mod SHIFT,DOWN,movewindow,d

# Move windows between monitors
bind=$mod SHIFT,comma,movewindow,mon:-1
bind=$mod SHIFT,period,movewindow,mon:+1
bind=$mod,comma,focusmonitor,-1
bind=$mod,period,focusmonitor,+1

# Hyprbars plugin (title bars)
plugin {
  hyprbars {
    bar_height = 24
    bar_color = rgb(1e1e2e)
    col.text = rgb(cdd6f4)
    bar_text_font = Sans
    bar_text_size = 10

    hyprbars-button = rgb(f38ba8), 14, , hyprctl dispatch killactive
    hyprbars-button = rgb(a6e3a1), 14, , hyprctl dispatch fullscreen 1
  }
}

